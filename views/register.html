<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrazione | Piemarket - Riservato al Piemonte</title>
    <!-- Bootstrap 5 CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100 py-4">

    <div class="container" style="max-width: 480px;">
        <div class="text-center mb-4">
            <h1 class="h3 fw-bold text-primary mb-1">
                <i class="bi bi-shop"></i> Piemarket
            </h1>
            <span class="badge bg-primary text-white brand-badge">Piemonte</span>
            <p class="text-muted small mt-2">Registrazione riservata esclusivamente ai residenti in Piemonte</p>
        </div>

        <div class="card shadow-sm border-0 rounded-4">
            <div class="card-body p-4">
                <h4 class="card-title fw-bold mb-3 text-center">Crea Account</h4>
                <div id="alert-container"></div>

                <form id="form-register">
                    <div class="mb-3">
                        <label for="username" class="form-label">1. Nome Utente</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control" id="username" required minlength="3" maxlength="30" placeholder="mario_rossi">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">2. Email</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                            <input type="email" class="form-control" id="email" required placeholder="mario@esempio.it">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">3. Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                            <input type="password" class="form-control" id="password" required minlength="6" placeholder="Almeno 6 caratteri">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="confirmPassword" class="form-label">4. Conferma Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-shield-check"></i></span>
                            <input type="password" class="form-control" id="confirmPassword" required minlength="6" placeholder="Ripeti la password">
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="region" class="form-label">5. Regione di residenza</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-geo-alt"></i></span>
                            <select class="form-select" id="region" required>
                                <option value="" selected disabled>-- Seleziona la tua regione --</option>
                                <option value="Abruzzo">Abruzzo</option>
                                <option value="Basilicata">Basilicata</option>
                                <option value="Calabria">Calabria</option>
                                <option value="Campania">Campania</option>
                                <option value="Emilia-Romagna">Emilia-Romagna</option>
                                <option value="Friuli-Venezia Giulia">Friuli-Venezia Giulia</option>
                                <option value="Lazio">Lazio</option>
                                <option value="Liguria">Liguria</option>
                                <option value="Lombardia">Lombardia</option>
                                <option value="Marche">Marche</option>
                                <option value="Molise">Molise</option>
                                <option value="Piemonte">Piemonte</option>
                                <option value="Puglia">Puglia</option>
                                <option value="Sardegna">Sardegna</option>
                                <option value="Sicilia">Sicilia</option>
                                <option value="Toscana">Toscana</option>
                                <option value="Trentino-Alto Adige">Trentino-Alto Adige</option>
                                <option value="Umbria">Umbria</option>
                                <option value="Valle d'Aosta">Valle d'Aosta</option>
                                <option value="Veneto">Veneto</option>
                            </select>
                        </div>
                        <div class="form-text text-muted small mt-1">
                            Solo i residenti in <strong>Piemonte</strong> possono registrarsi.
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold" id="btn-register">Completa Registrazione</button>
                </form>
            </div>
            <div class="card-footer bg-white border-0 text-center pb-4 pt-0">
                <span class="text-muted small">Hai già un account?</span>
                <a href="/login" class="fw-semibold text-decoration-none">Accedi qui</a>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS & Script Unificato Client -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/client.js"></script>
</body>
</html>
