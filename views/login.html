<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accedi | Piemarket</title>
    <!-- Bootstrap 5 CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100 py-4">

    <div class="container" style="max-width: 440px;">
        <div class="text-center mb-4">
            <h1 class="h3 fw-bold text-primary mb-1">
                <i class="bi bi-shop"></i> Piemarket
            </h1>
            <span class="badge bg-primary text-white brand-badge">Piemonte</span>
            <p class="text-muted small mt-2">La bacheca di compravendita regionale per il Piemonte</p>
        </div>

        <div class="card shadow-sm border-0 rounded-4">
            <div class="card-body p-4">
                <h4 class="card-title fw-bold mb-3 text-center">Accedi</h4>
                <div id="alert-container"></div>

                <form id="form-login">
                    <div class="mb-3">
                        <label for="email" class="form-label">Indirizzo Email</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                            <input type="email" class="form-control" id="email" required placeholder="nome@esempio.it" autocomplete="email">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                            <input type="password" class="form-control" id="password" required placeholder="La tua password" autocomplete="current-password">
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold" id="btn-login">Accedi</button>
                </form>
            </div>
            <div class="card-footer bg-white border-0 text-center pb-4 pt-0">
                <span class="text-muted small">Non hai ancora un account?</span>
                <a href="/register" class="fw-semibold text-decoration-none">Registrati qui</a>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS & Script Unificato Client -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/client.js"></script>
</body>
</html>
